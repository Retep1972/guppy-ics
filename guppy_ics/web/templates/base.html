<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Guppy ICS{% endblock %}</title>

    <link rel="stylesheet" href="/static/css/style.css">

    {% block head %}{% endblock %}
</head>
<body>
<header class="topbar">
    <a class="brand" href="/" aria-label="Guppy ICS home">
        <span class="brand-logo" aria-hidden="true">🐟</span>
        <span class="brand-name">Guppy ICS</span>
    </a>
    <nav class="nav">
        <a href="/">Upload</a>
        <a href="/help">Help</a>
    </nav>
</header>

<main class="content">
    {% block content %}
    {% endblock %}
</main>

<footer class="footer">
    <span>Passive ICS Network Analysis</span>
</footer>

</body>
</html>
